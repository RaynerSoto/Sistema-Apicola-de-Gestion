spring:
  banner:
    location: banner/banner.txt
  application:
    name: Pais
  datasource:
    url: jdbc:postgresql:${GestionApicola}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
    jpa:
      format-sql: true
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          format_sql: true
        javax:
          persistence:
            query:
              timeout: 60000
      database: postgresql
      show-sql: true
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
server:
  port: 8086
  error:
    include-stacktrace: never
  address: localhost
  tomcat:
    connection-timeout: 40000
    max-wait: 100000
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /

enlaces:
  traduccion:
